name: Production Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run cf:typegen:check
      - run: bun run check-types
      - run: bun run check
      - run: bun run check:test-discovery
      - run: bun run test:coverage

  db-migrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Require a configured production D1 database
        run: |
          id=$(jq -r '.d1_databases[0].database_id' apps/server/wrangler.jsonc)
          test "$id" != "00000000-0000-0000-0000-000000000000" || {
            echo "::error::Create the production D1 database and set its UUID in apps/server/wrangler.jsonc"
            exit 1
          }
      - name: Apply D1 migrations
        run: |
          if find packages/db/src/migrations -maxdepth 1 -name '*.sql' -print -quit | grep -q .; then
            bun run db:migrate:remote
          else
            echo "No application migrations to apply"
          fi

  deploy-api:
    needs: db-migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Deploy Worker
        working-directory: apps/server
        env:
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: bunx wrangler deploy --var "CORS_ORIGIN:${PRODUCTION_WEB_URL}"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Build web
        env:
          VITE_SERVER_URL: ${{ vars.PRODUCTION_API_URL }}
        run: bun run --filter @bridge-portal/web build
      - name: Deploy Pages
        run: |
          app_slug=$(jq -r '.name' package.json)
          bunx wrangler pages deploy apps/web/dist --project-name "$app_slug" --branch master
