name: Preview Cleanup

on:
  pull_request:
    branches: [master]
    types: [closed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve resource names
        id: vars
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          app_slug=$(jq -r '.name' package.json)
          echo "worker=${app_slug}-api-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pages=${app_slug}" >> "$GITHUB_OUTPUT"
          echo "db=${app_slug}-db-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "r2=${app_slug}-raw-imports-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Delete Worker
        env:
          WORKER: ${{ steps.vars.outputs.worker }}
        run: |
          status=$(curl -s -o /tmp/worker-delete.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}?force=true" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$status" = 200 -o "$status" = 404 || { cat /tmp/worker-delete.json; exit 1; }
      - name: Delete Pages deployments
        env:
          PAGES: ${{ steps.vars.outputs.pages }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=$(curl -s -o /tmp/pages-deployments.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$status" = 404 ]; then
            exit 0
          fi
          test "$status" = 200 || { cat /tmp/pages-deployments.json; exit 1; }
          deployments=$(jq -r --arg branch "pr-${PR_NUMBER}" \
            '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' \
            /tmp/pages-deployments.json)
          for id in $deployments; do
            delete_status=$(curl -s -o /tmp/pages-delete.json -w '%{http_code}' -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES}/deployments/${id}?force=true" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            test "$delete_status" = 200 -o "$delete_status" = 404 || {
              cat /tmp/pages-delete.json
              exit 1
            }
          done
      - name: Delete preview D1
        env:
          DB_NAME: ${{ steps.vars.outputs.db }}
        run: |
          database_id=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=1000&name=${DB_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' | head -n1)
          if [ -n "$database_id" ]; then
            status=$(curl -s -o /tmp/d1-delete.json -w '%{http_code}' -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            test "$status" = 200 -o "$status" = 404 || {
              cat /tmp/d1-delete.json
              exit 1
            }
          fi
      - name: Delete preview R2
        env:
          R2_NAME: ${{ steps.vars.outputs.r2 }}
        run: bunx wrangler r2 bucket delete "$R2_NAME" || true
      - uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Preview Environment
      - uses: peter-evans/create-or-update-comment@v4
        if: steps.find.outputs.comment-id != ''
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Preview Environment

            ~Preview environment has been cleaned up.~
